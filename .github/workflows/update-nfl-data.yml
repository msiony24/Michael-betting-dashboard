name: Update Macabets NFL Data

on:
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season to refresh (leave blank for current season)"
        required: false
        type: string
  schedule:
    - cron: "20 10 * * *"

permissions:
  contents: write

concurrency:
  group: update-macabets-nfl-data
  cancel-in-progress: false

jobs:
  update-nfl-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Refresh NFL foundation
        run: |
          if [ -n "${{ github.event.inputs.season }}" ]; then
            python update_nfl_data.py --season "${{ github.event.inputs.season }}"
          else
            python update_nfl_data.py
          fi

      - name: Run NFL data tests
        run: python -m pytest tests/test_nfl_foundation.py tests/test_nfl_fetch_upgrade.py tests/test_nfl_team_state.py -q

      - name: Refresh NFL player weekly performance
        run: |
          if [ -n "${{ github.event.inputs.season }}" ]; then
            python update_nfl_player_stats.py "${{ github.event.inputs.season }}"
          else
            python update_nfl_player_stats.py
          fi

      - name: Refresh Sleeper NFL availability
        run: python update_nfl_availability.py

      - name: Build automated NFL ratings
        run: python update_nfl_ratings.py

      - name: Run NFL rating tests
        run: python -m pytest tests/test_nfl_rating_engine.py tests/test_nfl_availability.py tests/test_nfl_depth_chart.py tests/test_nfl_depth_chart_resolution.py tests/test_nfl_analyze.py tests/test_nfl_simulation.py -q

      - name: Commit refreshed NFL data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl/
          if git diff --cached --quiet; then
            echo "NFL data is already current."
          else
            git commit -m "Update automated NFL data foundation"
            git push
          fi
