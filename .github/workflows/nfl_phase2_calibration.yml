name: NFL Phase 2 Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'audit/nfl_phase2_calibration.py'
      - '.github/workflows/nfl_phase2_calibration.yml'

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run NFL Phase 2 calibration
        run: python audit/nfl_phase2_calibration.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: nfl-phase2-calibration-results
          path: audit/results_nfl_phase2/
          if-no-files-found: error

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/results_nfl_phase2
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "Store NFL Phase 2 calibration results"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            # Another workflow pushed while this job was building. Replay this
            # commit on top of theirs instead of failing the run.
            git fetch origin "$branch"
            git rebase "origin/$branch" || { git rebase --abort || true; exit 1; }
            [ "$attempt" -lt 4 ] && sleep $((attempt * 5))
          done
          exit 1
          fi
