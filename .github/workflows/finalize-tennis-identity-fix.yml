name: Finalize Tennis Identity Fix

on:
  push:
    branches:
      - fix/tennis-identity-compound-surnames

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/tennis-identity-compound-surnames
          fetch-depth: 0

      - name: Remove generated cache files
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch __pycache__ engine/__pycache__ tests/__pycache__
          git rm --ignore-unmatch data/api_tennis_cache/3f4baa5bc4fd19ba682719a5.json

      - name: Install tennis test dependencies
        run: python -m pip install --quiet pandas numpy requests streamlit pytest

      - name: Run tennis identity regressions
        run: python -m pytest tests/test_tennis_identity.py tests/test_tennis_daily_refresh.py tests/test_tennis_serve_return.py -q

      - name: Verify Felix-Cerundolo against repository data
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: |
          python - <<'PY' > tennis_identity_verification.txt
          from datetime import date
          from engine.data import load_matches
          from engine.tennis import analyze, perspective, resolve_player_name
          from engine.tennis_h2h import build_head_to_head_summary

          matches, errors = load_matches()
          if errors:
              print("Data load warnings:", errors)

          event_date = date(2026, 8, 18)
          felix, felix_resolution = resolve_player_name(matches, "Felix Auger-Aliassime")
          juan, juan_resolution = resolve_player_name(matches, "Juan Manuel Cerundolo")
          felix_history = perspective(matches, felix, event_date)
          juan_history = perspective(matches, juan, event_date)
          felix_hard = felix_history[felix_history["surface"].astype(str).str.casefold().eq("hard")]
          juan_hard = juan_history[juan_history["surface"].astype(str).str.casefold().eq("hard")]
          h2h = build_head_to_head_summary(
              matches,
              "Felix Auger-Aliassime",
              "Juan Manuel Cerundolo",
              "Hard",
          )

          result = analyze(
              matches=matches,
              player_a="Felix Auger-Aliassime",
              player_b="Juan Manuel Cerundolo",
              tournament="Winston-Salem Open",
              round_label="R32",
              surface="Hard",
              event_date=event_date,
              simulations=20000,
              tournament_category_label="ATP 250",
              environment="Outdoor",
              match_format="Best of 3",
          )

          print("Felix resolution:", felix_resolution)
          print("Juan resolution:", juan_resolution)
          print("Felix historical matches:", len(felix_history))
          print("Felix hard matches:", len(felix_hard))
          print("Juan historical matches:", len(juan_history))
          print("Juan hard matches:", len(juan_hard))
          print("H2H meetings:", h2h["meetings"])
          print("H2H Felix wins:", h2h["wins_a"])
          print("H2H Juan wins:", h2h["wins_b"])
          print("H2H hard meetings:", h2h["surface_meetings"])
          print("H2H last meeting:", h2h["last_meeting"])
          print("Corrected win probability:", result["win_probability"])
          print("Corrected fair line:", result["fair_line"])
          print("Felix two-year sample:", result["profile_a"].get("sample"))
          print("Felix hard sample:", result["profile_a"].get("surface_sample"))
          print("Juan two-year sample:", result["profile_b"].get("sample"))
          print("Juan hard sample:", result["profile_b"].get("surface_sample"))
          print("Data validation:", result["data_validation"])
          PY
          cat tennis_identity_verification.txt

      - name: Commit cleanup and verification snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-tennis-identity-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Finalize tennis identity fix"
          git push origin HEAD:fix/tennis-identity-compound-surnames
