name: Update Macabets Tennis Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * *"

permissions:
  contents: write

concurrency:
  group: update-macabets-tennis-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Macabets
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install data requirements
        run: python -m pip install pandas openpyxl requests pytest

      - name: Build daily ATP database
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: python update_tennis_data.py

      - name: Test daily ATP refresh logic
        run: python -m pytest tests/test_tennis_daily_refresh.py tests/test_tennis_serve_return.py -q

      - name: Show tennis freshness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/tennis_refresh_status.json")
          payload = json.loads(path.read_text())
          print("Latest ATP match date:", payload.get("latest_match_date"))
          print("Current-year matches:", payload.get("current_year_match_count"))
          print("Live refresh:", payload.get("live_refresh"))
          PY

      - name: Commit ATP data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/atp_matches_*.csv data/tennis_refresh_status.json
          if git diff --cached --quiet; then
            echo "ATP data is already current."
            exit 0
          fi

          git commit -m "Update ATP match data"

          branch="${GITHUB_REF_NAME:-main}"
          max_attempts=4

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Push attempt $attempt of $max_attempts..."

            # Another commit may have landed on main while this job was building data.
            # Rebase the generated-data commit onto the newest remote branch first.
            git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then
              echo "Rebase conflict detected. Rebuilding ATP data on top of latest $branch..."
              git rebase --abort || true
              git reset --hard "origin/$branch"
              API_TENNIS_KEY="${API_TENNIS_KEY:-}" python update_tennis_data.py
              git add data/atp_matches_*.csv data/tennis_refresh_status.json
              if git diff --cached --quiet; then
                echo "Latest $branch already contains current ATP data."
                exit 0
              fi
              git commit -m "Update ATP match data"
            fi

            if git push origin "HEAD:$branch"; then
              echo "ATP data pushed successfully."
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep_seconds=$((attempt * 5))
              echo "Push failed; retrying after ${sleep_seconds}s."
              sleep "$sleep_seconds"
            fi
          done

          echo "ATP data push failed after $max_attempts attempts." >&2
          exit 1
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
