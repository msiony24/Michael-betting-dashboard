name: Tennis name resolution hotfix

on:
  push:
    paths:
      - .github/workflows/hotfix-tennis-name-resolution.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch identity normalization
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('engine/tennis.py'); s=p.read_text(); old='    tokens = [token for token in tokens if len(token) > 1]\n    return \" \".join(tokens)'; new='    return \" \".join(tokens)'; assert old in s; p.write_text(s.replace(old,new,1))"
          python -c "from pathlib import Path; p=Path('engine/tennis.py'); s=p.read_text(); old='    # tennis-data.co.uk commonly stores players as \'Surname F.\' while APIs use \'First Surname\'.\n    if len(tokens) >= 2 and len(tokens[-1]) == 1:\n        return tokens[0], tokens[-1]'; new='    # Historical feeds store players as Surname F. or Surname J.M.\n    if len(tokens) >= 2 and len(tokens[0]) > 1 and all(len(token) == 1 for token in tokens[1:]):\n        return tokens[0], tokens[1]'; assert old in s; p.write_text(s.replace(old,new,1))"
          python -c "from pathlib import Path; p=Path('engine/player_profiles.py'); s=p.read_text(); old='    tokens = [token for token in tokens if len(token) > 1]\n    return \" \".join(tokens)'; new='    return \" \".join(tokens)'; assert old in s; p.write_text(s.replace(old,new,1))"

      - name: Install validation dependencies
        shell: bash
        run: python -m pip install -q pandas numpy

      - name: Validate Cerundolo resolution
        shell: bash
        run: |
          python -m py_compile engine/tennis.py engine/player_profiles.py
          python - <<'PY'
          import pandas as pd
          from datetime import date
          from engine.tennis import resolve_player_name, perspective, canonical_player_key
          from engine.player_profiles import _find_historical_name, _player_history

          matches = pd.DataFrame([
              {"tourney_date": pd.Timestamp("2026-02-10"), "winner_name": "Cerundolo J.M.", "loser_name": "Altmaier D.", "surface": "Clay", "tourney_level": "A", "round": "R128", "score": "6-2 6-2", "winner_rank": 80, "loser_rank": 51},
              {"tourney_date": pd.Timestamp("2026-02-12"), "winner_name": "Cerundolo F.", "loser_name": "Dellien H.", "surface": "Clay", "tourney_level": "A", "round": "R64", "score": "6-0 7-6", "winner_rank": 19, "loser_rank": 167},
          ])
          resolved, meta = resolve_player_name(matches, "Juan Manuel Cerundolo")
          assert resolved == "Cerundolo J.M.", (resolved, meta)
          assert canonical_player_key("Cerundolo J.M.") != canonical_player_key("Cerundolo F.")
          rows = perspective(matches, resolved, date(2026, 3, 1))
          assert len(rows) == 1
          assert _find_historical_name(matches, resolved) == "Cerundolo J.M."
          history = _player_history(matches, resolved, date(2026, 3, 1))
          assert len(history) == 1
          print("Cerundolo identity resolution passed")
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add engine/tennis.py engine/player_profiles.py
          git commit -m "Fix tennis player identity resolution"
          git push
