# Trigger persistent tennis player ID migration
name: Apply Tennis Player IDs

on:
  push:
    branches:
      - feature/tennis-player-ids

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/tennis-player-ids
          fetch-depth: 0

      - name: Apply player ID migration
        run: python scripts/apply_tennis_player_ids.py

      - name: Install test dependencies
        run: python -m pip install --quiet pandas numpy requests streamlit pytest

      - name: Run tennis identity tests
        run: python -m pytest tests/test_tennis_identity.py tests/test_tennis_daily_refresh.py tests/test_tennis_serve_return.py -q

      - name: Compile changed tennis modules
        run: python -m py_compile engine/tennis_identity.py update_tennis_data.py

      - name: Commit tested player ID upgrade
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-tennis-player-ids.yml
          rm scripts/apply_tennis_player_ids.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist API tennis player IDs"
          git push origin HEAD:feature/tennis-player-ids
