name: NFL Rating Backtest

on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Skip the 27-setting grid (faster, main comparison only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Check backtest machinery (offline)
        run: python -m pytest tests/test_nfl_rating_backtest.py tests/test_nfl_rating_engine.py -q

      - name: Replay the 2025 season
        env:
          QUICK: ${{ inputs.quick }}
        run: |
          if [ "$QUICK" = "true" ]; then
            python audit/nfl_rating_backtest.py --quick
          else
            python audit/nfl_rating_backtest.py
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: nfl-rating-backtest-results
          path: audit/results_nfl_rating_backtest/
          if-no-files-found: error

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/results_nfl_rating_backtest
          if git diff --cached --quiet; then
            echo "No result changes."
            exit 0
          fi
          git commit -m "Store NFL rating backtest results"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            git fetch origin "$branch"
            git rebase "origin/$branch" || { git rebase --abort || true; exit 1; }
            [ "$attempt" -lt 4 ] && sleep $((attempt * 5))
          done
          exit 1
