name: Test NFL Engine

on:
  workflow_dispatch:
  push:
    paths:
      - "engine/nfl_team_quality.py"
      - "engine/nfl_ratings_loader.py"
      - "engine/nfl_coaching.py"
      - "data/nfl_team_ratings.json"
      - "data/coaching_2026.csv"
      - "test_nfl_team_quality.py"
      - "test_nfl_ratings_loader.py"
      - "tests/test_nfl_team_quality.py"
      - "tests/test_nfl_ratings_loader.py"
      - "tests/test_nfl_coaching.py"
      - ".github/workflows/test-nfl-engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements.txt pytest

      - name: Run NFL Engine Tests
        run: |
          python -m pytest tests/test_nfl_team_quality.py tests/test_nfl_ratings_loader.py tests/test_nfl_coaching.py -v
