name: Update Macabets Player Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *"

permissions:
  contents: write

jobs:
  update-player-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Macabets
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build daily ATP player intelligence
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: python update_player_intelligence.py

      - name: Commit player intelligence snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player_intelligence_atp.json
          if git diff --cached --quiet; then
            echo "ATP player intelligence is already current."
            exit 0
          fi
          git commit -m "Update ATP player intelligence"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            # Another workflow pushed while this job was building. Replay this
            # commit on top of theirs instead of failing the run.
            git fetch origin "$branch"
            git rebase "origin/$branch" || { git rebase --abort || true; exit 1; }
            [ "$attempt" -lt 4 ] && sleep $((attempt * 5))
          done
          exit 1
