name: Update Macabets Player Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *"

permissions:
  contents: write

jobs:
  update-player-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Macabets
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build daily ATP player intelligence
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: python update_player_intelligence.py

      - name: Commit player intelligence snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player_intelligence_atp.json
          git diff --cached --quiet || git commit -m "Update ATP player intelligence"
          git push
